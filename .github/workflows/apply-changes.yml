name: "Apply DeviceTree Changes"

# Takes the (hand-edited) device trees living on the DeviceTree branch,
# diffs them against pristine upstream kernel sources, and publishes the
# result as .patch files that the build workflow can apply.

env:
  DEVICETREE_BRANCH: "DeviceTree"
  PATCH_DIR: "patches"

on:
  push:
    branches:
      - DeviceTree
    # Any change on the branch, except the files this workflow writes
    # back itself (otherwise the patch commit would re-trigger the run).
    paths-ignore:
      - "patches/**"
      - "README.md"
      - ".github/**"
  workflow_dispatch:
    inputs:
      kernel:
        description: "Which kernel variant to diff"
        type: choice
        required: true
        default: "all"
        options:
          - all
          - GKI
          - CLO

jobs:
  generate-patches:
    name: "Diff ${{ matrix.kernel.name }} device tree"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kernel:
          - name: "GKI"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
          - name: "CLO"
            repo_name: "clo"
            repo_url: "https://git.codelinaro.org/clo/la/kernel/msm-5.15.git"
            branch: "kernel.lnx.5.15.r1-rel"

    env:
      KERNEL_NAME: ${{ matrix.kernel.repo_name }}
      KERNEL_REPO: ${{ matrix.kernel.repo_url }}
      KERNEL_BRANCH: ${{ matrix.kernel.branch }}

    steps:
      - name: "Checkout DeviceTree branch"
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEVICETREE_BRANCH }}
          path: devicetree
          fetch-depth: 1

      - name: "Decide whether to run this variant"
        id: check
        env:
          SELECTED: ${{ github.event.inputs.kernel || 'all' }}
        run: |
          if [ "$SELECTED" != "all" ] && [ "$SELECTED" != "${{ matrix.kernel.name }}" ]; then
            echo "Skipping ${{ matrix.kernel.name }} (selected: $SELECTED)"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -d "devicetree/${{ matrix.kernel.name }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No devicetree/${{ matrix.kernel.name }} folder on ${{ env.DEVICETREE_BRANCH }} — nothing to diff"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Clone pristine kernel source (shallow)"
        if: steps.check.outputs.present == 'true'
        run: |
          git clone --branch "${{ env.KERNEL_BRANCH }}" \
            "${{ env.KERNEL_REPO }}" pristine --depth=1

      - name: "Overlay edited device trees and generate patch"
        if: steps.check.outputs.present == 'true'
        run: |
          set -euo pipefail

          SRC="devicetree/${{ matrix.kernel.name }}"

          # The DeviceTree branch mirrors each file's path relative to the
          # kernel root (e.g. GKI/arch/arm64/boot/dts/...), so a plain copy
          # lands everything where it belongs.
          cp -a "$SRC"/. pristine/

          cd pristine
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          mkdir -p "../out"
          PATCH="../out/0001-${{ matrix.kernel.name }}-devicetree.patch"

          if git diff --cached --quiet; then
            echo "::notice::${{ matrix.kernel.name }} device trees match upstream — no patch generated"
            exit 0
          fi

          {
            echo "From: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            echo "Subject: [PATCH] ${{ matrix.kernel.name }}: apply DroidYASK device tree changes"
            echo ""
            echo "Generated from the ${{ env.DEVICETREE_BRANCH }} branch against"
            echo "${{ env.KERNEL_REPO }} (${{ env.KERNEL_BRANCH }})."
            echo "Source commit: ${{ github.sha }}"
            echo ""
            echo "---"
            git diff --cached --binary
          } > "$PATCH"

          echo "Patch written: $(wc -l < "$PATCH") lines"
          git diff --cached --stat | tail -n 1

      - name: "Verify the patch applies cleanly"
        if: steps.check.outputs.present == 'true'
        run: |
          set -euo pipefail
          PATCH="out/0001-${{ matrix.kernel.name }}-devicetree.patch"
          [ -f "$PATCH" ] || { echo "No patch to verify"; exit 0; }

          git clone --branch "${{ env.KERNEL_BRANCH }}" \
            "${{ env.KERNEL_REPO }}" verify --depth=1
          cd verify
          git apply --check --verbose "../$PATCH"
          echo "✔ Patch applies cleanly to a fresh ${{ matrix.kernel.name }} tree"

      - name: "📤 Upload patch"
        if: steps.check.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.kernel.name }}-devicetree-patch"
          path: "out/*.patch"
          retention-days: 7
          if-no-files-found: ignore

  publish-patches:
    name: "Publish patches to DeviceTree"
    runs-on: ubuntu-latest
    needs: [generate-patches]
    permissions:
      contents: write
    steps:
      - name: "Checkout DeviceTree branch"
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEVICETREE_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: "📥 Download patches"
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/
          merge-multiple: true

      - name: "Stage patches"
        run: |
          set -euo pipefail
          if ! compgen -G "./artifacts/*.patch" > /dev/null; then
            echo "::notice::No patches produced — nothing to commit"
            echo "HAS_PATCHES=false" >> "$GITHUB_ENV"
            exit 0
          fi

          mkdir -p "${{ env.PATCH_DIR }}"
          rm -f "${{ env.PATCH_DIR }}"/*.patch
          cp ./artifacts/*.patch "${{ env.PATCH_DIR }}"/
          rm -rf ./artifacts
          echo "HAS_PATCHES=true" >> "$GITHUB_ENV"

          ls -lh "${{ env.PATCH_DIR }}"

      - name: "Commit and push (only if anything actually changed)"
        id: commit
        if: env.HAS_PATCHES == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A "${{ env.PATCH_DIR }}"

          if git diff --cached --quiet; then
            echo "::notice::Patches identical to what's already committed — nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --cached --stat
            git commit -m "Update device tree patches - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin "${{ env.DEVICETREE_BRANCH }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "Kick off a kernel build"
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Fires the build only when the device trees genuinely differ from
          # the last run. Drop this step if you'd rather build manually.
          gh workflow run yask.yml --repo "${{ github.repository }}" --ref main \
            && echo "✔ Triggered Build DroidYisky" \
            || echo "::warning::Could not trigger yask.yml (a PAT in secrets.GH_TOKEN is needed for cross-workflow dispatch)"
