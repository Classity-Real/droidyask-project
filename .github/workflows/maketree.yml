name: "Extract Device Trees"

env:
  OUT_DIR: "devicetree-out"
  DEVICETREE_BRANCH: "DeviceTree"

on:
  workflow_dispatch:

jobs:
  extract-devicetree:
    name: "Extract ${{ matrix.kernel.name }} device tree"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kernel:
          - name: "GKI"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
          - name: "CLO"
            repo_name: "clo"
            repo_url: "https://git.codelinaro.org/clo/la/kernel/msm-5.15.git"
            branch: "kernel.lnx.5.15.r1-rel"

    env:
      KERNEL_NAME: ${{ matrix.kernel.repo_name }}
      KERNEL_REPO: ${{ matrix.kernel.repo_url }}
      KERNEL_BRANCH: ${{ matrix.kernel.branch }}

    steps:
      - name: "Clone kernel source (shallow)"
        run: |
          git clone --recursive --branch "${{ env.KERNEL_BRANCH }}" \
            "${{ env.KERNEL_REPO }}" "${{ env.KERNEL_NAME }}" --depth=1

      - name: "Locate and copy device tree sources"
        run: |
          set -e
          DEST_ROOT="${{ env.OUT_DIR }}/${{ matrix.kernel.name }}"
          mkdir -p "$DEST_ROOT"

          cd "${{ env.KERNEL_NAME }}"

          # Heuristic: pull out every directory that looks like it holds
          # devicetree sources (dts/dtsi files), wherever it lives in the
          # tree (arch/arm64/boot/dts, arch/arm64/boot/dts/vendor/qcom,
          # techpack overlays, etc). This is deliberately broad since GKI
          # vs vendor (CLO) trees don't lay these out the same way.
          #
          # If you know the exact path for a given kernel, replace this
          # loop with a plain `cp -r <known-path> "$DEST_ROOT/<path>"`
          # for a faster, more precise copy.
          FOUND_ANY=0
          while IFS= read -r -d '' dts_dir; do
            FOUND_ANY=1
            rel_path="${dts_dir#./}"
            dest="../$DEST_ROOT/$rel_path"
            mkdir -p "$dest"
            cp -a "$dts_dir"/. "$dest"/
            echo "✔ Copied $rel_path"
          done < <(find . -type d \( -iname "dts" -o -iname "dt-bindings" \) -not -path "*/.git/*" -print0)

          # Also grab any loose .dts/.dtsi files that might live outside a
          # "dts"-named directory (some vendor trees do this).
          while IFS= read -r -d '' f; do
            FOUND_ANY=1
            rel_path="${f#./}"
            dest_dir="../$DEST_ROOT/$(dirname "$rel_path")"
            mkdir -p "$dest_dir"
            cp -a "$f" "$dest_dir"/
          done < <(find . -type f \( -iname "*.dts" -o -iname "*.dtsi" \) -not -path "*/.git/*" -print0)

          if [ "$FOUND_ANY" -eq 0 ]; then
            echo "::warning::No device tree files found for ${{ matrix.kernel.name }} (branch ${{ env.KERNEL_BRANCH }})"
          fi

      - name: "📤 Upload device tree artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.kernel.name }}-devicetree"
          path: "${{ env.OUT_DIR }}/${{ matrix.kernel.name }}"
          retention-days: 1
          if-no-files-found: warn

  publish-devicetree:
    name: "Publish DeviceTree branch"
    runs-on: ubuntu-latest
    needs: [extract-devicetree]
    permissions:
      contents: write
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: "📥 Download device tree artifacts"
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/

      - name: "Prepare DeviceTree branch"
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "${{ env.DEVICETREE_BRANCH }}" >/dev/null 2>&1; then
            echo "Branch exists — checking it out"
            git fetch origin "${{ env.DEVICETREE_BRANCH }}"
            git checkout "${{ env.DEVICETREE_BRANCH }}"
            # Wipe tracked files so removed/renamed dts files don't linger
            git rm -rf --ignore-unmatch . >/dev/null
          else
            echo "Branch does not exist — creating orphan branch"
            git checkout --orphan "${{ env.DEVICETREE_BRANCH }}"
            git rm -rf --ignore-unmatch . >/dev/null 2>&1 || true
          fi

      - name: "Populate branch with extracted device trees"
        run: |
          set -e
          # artifacts/<KernelName>-devicetree/<...dts files...>
          for dir in ./artifacts/*-devicetree; do
            [ -d "$dir" ] || continue
            kernel_name=$(basename "$dir" | sed 's/-devicetree$//')
            mkdir -p "$kernel_name"
            cp -a "$dir"/. "$kernel_name"/
          done

          cat > README.md << EOF
          # Device Trees

          Auto-extracted device tree sources (\`.dts\` / \`.dtsi\`) pulled from the
          kernel sources built by the DroidYisky workflow.

          Last updated: $(date -u +'%Y-%m-%d %H:%M UTC')

          One top-level folder per kernel variant (GKI, CLO), mirroring the
          relative path of each device tree directory in its source tree.
          EOF

      - name: "Commit and push"
        run: |
          set -e
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update device trees - $(date -u +'%Y-%m-%d')"
            git push --force origin "${{ env.DEVICETREE_BRANCH }}"
          fi
