name: "Build DroidYisky"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
        
jobs:
  build-kernels:
    name: "Build ${{ matrix.kernel.name }} kernel"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kernel:
          - name: "GKI"
            dir: "common_gki"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            defconfig: "gki_defconfig"
            local_version: "-YASK-GKI"
            output_name: "Image.gki.ksu"
            enable_ksu: true
            extra_patches:
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-sign-builds.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-Don-t-append-and-dirty-to-localversion.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-do-not-ship-full-auto_localversion.patch"
          - name: "CLO"
            dir: "common_clo"
            repo_name: "clo"
            repo_url: "https://git.codelinaro.org/clo/la/kernel/msm-5.15.git"
            branch: "kernel.lnx.5.15.r1-rel"
            defconfig: "gki_defconfig"
            local_version: "-YASK-CLO"
            output_name: "Image.clo.ksu"
            enable_ksu: true
            extra_patches:
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-sign-builds.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-Don-t-append-and-dirty-to-localversion.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-do-not-ship-full-auto_localversion.patch"

    env:
      KERNEL_LOC_DIR: ${{ matrix.kernel.dir }}
      KERNEL_NAME: ${{ matrix.kernel.repo_name }}
      KERNEL_REPO: ${{ matrix.kernel.repo_url }}
      KERNEL_BRANCH: ${{ matrix.kernel.branch }}
      DEFCONFIG_NAME: ${{ matrix.kernel.defconfig }}
      LOCAL_VERSION: ${{ matrix.kernel.local_version }}
      OUTPUT_NAME: ${{ matrix.kernel.output_name }}
      WORK_DIR: ${{ github.workspace }}

    steps:
      - name: "Free up disk space"
        run: |
          echo "Disk space before cleanup:"
          df -h /

          # Remove large preinstalled toolchains/SDKs we don't need for a kernel build.
          # These regularly free 25-30GB on ubuntu-latest runners.
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /opt/az
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force 2>/dev/null || true

          echo "Disk space after cleanup:"
          df -h /

      - name: "Setup workspace"
        run: |
          mkdir -p ${{ env.KERNEL_LOC_DIR }}
          echo "BUILD_TIME=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2 ccache

      - name: "Cache ccache"
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.kernel.name }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.kernel.name }}-

      - name: Setup SWAP 10GB
        uses: pierotofy/set-swap-space@master
        with:
            swap-size-gb: 20
            
      - name: Tune Swap
        run: |
            echo "vm.swappiness=80" | sudo tee -a /etc/sysctl.conf
            sudo sysctl -p

      - name: "Clone kernel source"
        working-directory: ./${{ env.KERNEL_LOC_DIR }}
        run: |
          git clone --recursive --branch ${{ env.KERNEL_BRANCH }} \
            ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }} --depth=1

      - name: "Initialize AOSP repo"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          # Initialize AOSP repo (shallow — history isn't needed, we only want
          # the working tree for build scripts + prebuilts layout)
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune -j8

          # Clean up existing repo and common directories
          rm -rf .repo
          rm -rf common

          # Remove unused default clang toolchains for more space
          rm -rf prebuilts/clang/host/linux-x86/clang-3289846
          rm -rf prebuilts/clang/host/linux-x86/clang-r450784e
          rm -rf prebuilts/clang/host/linux-x86/clang-stable

          # Update build config constants
          sed -i \
           -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
           -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r547379/' \
           ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.constants

          # Remove defconfig check (if exists)
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki || true

      - name: "Cache clang toolchain"
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.WORK_DIR }}/prebuilts/clang/host/linux-x86/clang-r547379
          key: clang-r547379-v1

      - name: "Download custom clang toolchain (cache miss only)"
        if: steps.clang-cache.outputs.cache-hit != 'true'
        working-directory: ${{ env.WORK_DIR }}
        run: |
          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r547379.tar.gz "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          tar -xzf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz -C prebuilts/clang/host/linux-x86/clang-r547379
          rm -rf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz

      - name: "Configure kernel & patches"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          echo "CONFIG_LOCALVERSION=\"${{ env.LOCAL_VERSION }}-${{ env.BUILD_TIME }}\"" >> "$CONFIG_FILE"
          echo "CONFIG_LOCALVERSION_AUTO=n" >> "$CONFIG_FILE"

          # Helper
          apply_patch() {
            local url="$1"
            local file=$(basename "$url")
            curl -L -o "$file" "$url"
            patch -p1 < "$file" || echo "::warning::Hunks failed in $file"
            rm -f "$file"
          }

          # Apply patches
          echo '${{ toJSON(matrix.kernel.extra_patches) }}' | jq -r '.[]' | while read p; do
            [ -n "$p" ] && apply_patch "$p"
          done

      - name: "🔧 Add BBG Support (KSU variant only)"
        if: matrix.kernel.enable_ksu == true
        working-directory: ./${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          echo "Adding BBG...";
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          echo "CONFIG_BBG=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig

      - name: "Setup KernelSU-Next with SUSFS"
        if: matrix.kernel.enable_ksu == true
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          rm -rf ./KernelSU-Next ./drivers/kernelsu

          echo "Installing KernelSU-Next..."
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s stable

          echo "✔ KernelSU-Next installed successfully"
          
          # Clone SUSFS4KSU for kernel patches only (not KSU integration)
          echo "Cloning SUSFS4KSU for kernel patches..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15

          echo "Applying namespace.c Fake Patch (if applicable)"
          if grep -q '^#include <trace/hooks/blk.h>$' fs/namespace.c; then
            sed -i '/^#include <trace\/hooks\/blk.h>$/d' fs/namespace.c
            NS_FAKE_PATCHED=1
          else
            echo "blk.h include not present in fs/namespace.c — skipping fake patch"
            NS_FAKE_PATCHED=0
          fi

          echo "Applying task_mmu.c Fake Patch (if applicable)"
          if grep -q '^#include <trace/hooks/mm.h>$' fs/proc/task_mmu.c; then
            sed -i '/^#include <trace\/hooks\/mm.h>$/d' fs/proc/task_mmu.c
            MM_FAKE_PATCHED=1
          else
            echo "mm.h include not present in fs/proc/task_mmu.c — skipping fake patch"
            MM_FAKE_PATCHED=0
          fi
          
          SUSFS_KERNEL_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
          
          echo "Applying SUSFS kernel patch..."
          if patch -p1 < "$SUSFS_KERNEL_PATCH"; then
            echo "SUSFS patch successfully applied"
          else
            echo "SUSFS patch failed — copying files manually"
          fi

          # NOTE: KernelSU-Next ships with SUSFS hooks built into its source
          # already (confirmed by "Reversed (or previously applied) patch
          # detected!" when the vanilla-KernelSU integration patch was tried
          # here previously) — no separate KSU-side integration patch is
          # needed or wanted, unlike upstream tiann/KernelSU. Only the
          # generic kernel patch above and the file copies below are needed.

          echo "Forcing SUSFS source injection..."
          
          # Always replace fs/susfs.c
          mkdir -p fs
          cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          echo "✔ Copied fs/susfs.c"
          
          # Always replace include/linux/susfs.h
          mkdir -p include/linux
          cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          echo "✔ Copied include/linux/susfs.h"
          
          # Also install missing susfs_def.h
          if [ -f susfs4ksu/kernel_patches/include/linux/susfs_def.h ]; then
            cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h
            echo "✔ Copied include/linux/susfs_def.h"
          else
            echo "susfs_def.h not found in repo"
          fi
          
          echo "Verifying SUSFS files..."
          for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
            if [ -f "$f" ]; then echo "✔ Found: $f"; else echo "❌ Missing: $f"; fi
          done
          
          # Clean up SUSFS repo (we only needed kernel patches, not KSU integration)
          rm -rf susfs4ksu
          
          # Create symbolic link for drivers/kernelsu (if needed by build system)
          if [ ! -L "drivers/kernelsu" ]; then
            ln -sf ../KernelSU-Next drivers/kernelsu
            echo "✔ Created drivers/kernelsu symlink"
          fi

          echo "SUSFS build wiring verified"

          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF

          echo "Reverting namespace.c Fake Patch (if applicable)"
          if [ "$NS_FAKE_PATCHED" = "1" ] && ! grep -q 'trace/hooks/blk.h' fs/namespace.c; then
            if grep -q '^#include "internal.h"$' fs/namespace.c; then
              sed -i '/^#include "internal.h"$/a #include <trace/hooks/blk.h>' fs/namespace.c
              echo "✔ Restored blk.h include"
            else
              echo "Anchor #include \"internal.h\" not found — could not restore blk.h include, check fs/namespace.c manually"
            fi
          else
            echo "Skipping blk.h restore (not fake-patched or already present)"
          fi

          echo "Reverting task_mmu.c Fake Patch (if applicable)"
          if [ "$MM_FAKE_PATCHED" = "1" ] && ! grep -q 'trace/hooks/mm.h' fs/proc/task_mmu.c; then
            if grep -q '^#include <linux/pkeys.h>$' fs/proc/task_mmu.c; then
              sed -i '/^#include <linux\/pkeys.h>$/a #include <trace/hooks/mm.h>' fs/proc/task_mmu.c
              echo "✔ Restored mm.h include"
            else
              echo "Anchor #include <linux/pkeys.h> not found — could not restore mm.h include, check fs/proc/task_mmu.c manually"
            fi
          else
            echo "Skipping mm.h restore (not fake-patched or already present)"
          fi
          
          echo "KSU configs added"

          echo "KernelSU-Next installed and SUSFS for GKI android13-5.15 fully integrated!"

      - name: "Add DroidSpace Support"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          echo "Adding DroidSpace (Droidspaces-OSS) support..."

          # This is a GKI kernel below 6.12 (5.15), so CONFIG_SYSVIPC / CONFIG_IPC_NS
          # need a kABI-safe patch first or vendor modules (GPU/Camera) will bootloop.
          # The upstream repo ships 3 candidate patches for different reserved-field
          # layouts (1_2_3 / 3_4_5 / 6_7_8) — only one will apply cleanly against a
          # given kernel source, so try each until one succeeds.
          DS_PATCH_BASE="https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12"
          DS_APPLIED=0

          for variant in 1_2_3 3_4_5 6_7_8; do
            patch_name="001.GKI-below-6.12-fix_sysvipc_kabi_${variant}.patch"
            echo "🔎 Trying kABI fix variant: $variant"
            curl -fLSs -o "$patch_name" "$DS_PATCH_BASE/$patch_name" || { echo "⚠️ Could not download $patch_name"; continue; }

            if patch -p1 --dry-run < "$patch_name" > /dev/null 2>&1; then
              patch -p1 < "$patch_name"
              echo "✅ Applied SYSVIPC kABI fix ($variant)"
              DS_APPLIED=1
              rm -f "$patch_name"
              break
            else
              echo "ℹ️ Variant $variant does not match this kernel's reserved layout — skipping"
              rm -f "$patch_name"
            fi
          done

          if [ "$DS_APPLIED" -ne 1 ]; then
            echo "::warning::No DroidSpace kABI fix patch applied cleanly — DroidSpace configs will still be added, but CONFIG_SYSVIPC/CONFIG_IPC_NS may break vendor module kABI on-device. Verify manually."
          fi

          # kABI-safe GKI config fragment for DroidSpace support
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          cat >> "$CONFIG_FILE" << 'EOF'
          # DroidSpace (Droidspaces-OSS) support
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_IPC_NS=y
          CONFIG_PID_NS=y
          CONFIG_DEVTMPFS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_USER_NS=y
          CONFIG_NETFILTER_XT_TARGET_REJECT=y
          EOF

          echo "DroidSpace configs added"

      - name: "⚙️ Setup basic configs"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          
          # addon configs
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_WESTWOOD=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_KALLSYMS=y
          EOF
          
          echo "Basic configs added"

      - name: "Append custom Makefile line"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
         # echo 'KBUILD_CFLAGS += -Wno-default-const-init-unsafe' >> Makefile
         # echo 'KBUILD_CFLAGS += -Wno-uninitialized-const-pointer' >> Makefile
         echo 'KBUILD_CFLAGS += -Wno-implicit-function-declaration' >> Makefile
         echo "Custom Makefile line added successfully"
    
      - name: "🔨 Build kernel"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          ccache -M 5G
          ccache -z

          LTO=thin \
          USE_CCACHE=1 \
          CCACHE_EXEC=$(command -v ccache) \
          BUILD_CONFIG=${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64 \
          build/build.sh -j$(nproc --all)

          ccache -s

      - name: "Copy kernel image"
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: |
          cp Image "${{ env.OUTPUT_NAME }}"

      - name: "📤 Upload kernel artifact"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.kernel.name }}-kernel
          path: ${{ env.WORK_DIR }}/out/dist/${{ env.OUTPUT_NAME }}
          retention-days: 1

  package-kernels:
    name: "Package Kernels"
    runs-on: ubuntu-latest
    needs: [build-kernels]
    permissions:
      contents: write
    steps:
      - name: "📥 Download kernel artifacts"
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/

      - name: "📦 Create release package"
        run: |
          set -e

          # Clone AnyKernel3
          git clone --depth=1 https://github.com/topnotchfreaks/AnyKernel3 -b YASK AnyKernel3

          # Copy kernel images
          find ./artifacts -name "Image.*" -exec cp {} AnyKernel3/ \;

          # Create banner
          cat > AnyKernel3/banner << 'EOF'
          DroidYASS - DroidYetAnotherStockSpace
          Original By: @belowzeroiq
          Maintainer: @graytvhead on telegram

          Features:
           • Full LTO + -O2 Optimization
           • Extra TCP Congestion (BBR, Westwood)
           • AOSP clang-r547379
           • KernelSU-Next + SUSFS support
           • Baseband-Guard Support
           • Metamodule Support
           • DroidSpace Support

          Info:
           • Supported Devices:
             Topaz: Android 13 - 16
             Tapas: Android 13 - 16
             Sapphire: Android 13 - 16
             Sapphiren: Android 13 - 16
             Creek: Android 13 - 16
             Xun: Android 13 - 16

          Managers:
           • KernelSU-Next

          Please ensure:
           • Your device is compatible
           • You have a backup of your current kernel
           • Ensure you have a unlocked bootloader
          EOF
          # Create ZIP
          ZIP_NAME="Anykernel3_YASK-KernelSUNext-AIO-FULL_$(date +'%Y-%m-%d').zip"
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git/*
          cd ..
          
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          # GitHub's Immutable Releases feature permanently locks a tag's assets
          # once published — reusing a static tag_name across runs fails on the
          # second and every subsequent run. Give each run its own dated tag.
          echo "RELEASE_TAG=DroidYASK-$(date +'%Y-%m-%d')-${{ github.run_number }}" >> $GITHUB_ENV
          echo "Package created: $ZIP_NAME"

      - name: "Upload to GitHub Release (draft)"
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          files: ${{ env.ZIP_NAME }}
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true

      - name: "🚀 Publish GitHub Release"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Immutable Releases lock a release (and block asset uploads) the
          # instant it's published — so the previous step creates it as a
          # draft (mutable, assets attach fine) and this step publishes it
          # only after the asset upload has already succeeded.
          gh release edit "${{ env.RELEASE_TAG }}" --draft=false --repo "${{ github.repository }}"
